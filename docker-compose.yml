version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama3-70b-8192
      - DATABASE_URL=sqlite:///./documind.db
      - ALLOWED_ORIGINS=["http://localhost:3000"]
      - DEBUG=false
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/vector_stores:/app/vector_stores
      - ./data/documind.db:/app/documind.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
