# ─── Render Blueprint config ────────────────────────────────────────────────────
# Deploys both backend (FastAPI) and frontend (Next.js) from one repo in one click.
# On Render: New → Blueprint → connect repo → done.

services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  - type: web
    name: documind-backend
    runtime: python
    rootDir: chatbot/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false                   # Set this in the Render dashboard — keep it secret
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        value: sqlite:///./documind.db
      - key: UPLOAD_DIR
        value: uploads
      - key: VECTOR_STORE_DIR
        value: vector_stores
      - key: ALLOWED_ORIGINS
        value: '["https://documind-frontend.onrender.com"]'
      - key: SIMILARITY_THRESHOLD
        value: "0.1"

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  - type: web
    name: documind-frontend
    runtime: node
    rootDir: chatbot/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.0.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://documind-backend.onrender.com
